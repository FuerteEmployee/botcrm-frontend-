<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- maximum-scale + user-scalable: pinch and double-tap zoom are the two
         gestures that most obviously mark a screen as a web page rather than an
         app. Chrome ignores these for accessibility, which is correct for the
         open web; a Capacitor WebView honours them, and this is an app.
         Deliberately NOT viewport-fit=cover: that would push content under the
         status and gesture bars, and the layout does not yet carry safe-area
         insets to compensate. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#12030b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BE ON TIME</title>
    <!--
      BOOT SCREEN — painted before any JavaScript runs.

      The native launch screen hands over the moment the WebView exists, which
      is long before React has mounted. Without something here the user watched
      a blank white page for that whole gap -- seconds on a slow handset, and
      longer still on a cold start while an OTA bundle is being applied.

      Everything below is inline on purpose: no stylesheet, no font and no
      image request, so it renders on the first frame. The mark is a 128px
      data URI (6.4 KB) rather than a link to /favicon.png, because a separate
      request -- even a local one -- can land a frame late and flash.

      Removed by clearBootScreen() in src/main.tsx once React has painted.
    -->
    <style>
      #boot{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;
        align-items:center;justify-content:center;background:#12030b;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        opacity:1;transition:opacity .28s ease}
      #boot[data-hide="1"]{opacity:0;pointer-events:none}
      /* the two corner glows from the brand sheet */
      #boot::before,#boot::after{content:"";position:absolute;width:74vw;height:74vw;
        border-radius:50%;filter:blur(2px);pointer-events:none}
      #boot::before{top:-34vw;left:-30vw;
        background:radial-gradient(circle,rgba(236,17,136,.30) 0%,rgba(236,17,136,.07) 55%,transparent 72%)}
      #boot::after{bottom:-36vw;right:-28vw;
        background:radial-gradient(circle,rgba(236,17,136,.24) 0%,rgba(236,17,136,.05) 55%,transparent 72%)}
      #boot-inner{position:relative;display:flex;flex-direction:column;align-items:center}
      #boot-logo{width:132px;height:132px;display:block;
        filter:drop-shadow(0 0 22px rgba(236,17,136,.34))}
      #boot-name{margin-top:26px;font-size:26px;font-weight:700;letter-spacing:.20em;
        color:#fff;white-space:nowrap}
      #boot-name span{color:#ec1188}
      #boot-sub{margin-top:10px;font-size:10px;letter-spacing:.42em;color:#9b8792;
        display:flex;align-items:center;gap:10px;white-space:nowrap}
      #boot-sub::before,#boot-sub::after{content:"";width:26px;height:1px;background:#5c4450}
      #boot-bar{margin-top:44px;width:190px;height:4px;border-radius:99px;
        background:#3a2430;overflow:hidden}
      /* A PARTIAL FILL WITH A SWEEP, not a slider that leaves the track.
         An indeterminate bar that travels off both ends is empty for part of
         every cycle, and a launch screen showing an empty progress bar reads as
         hung rather than loading. This always shows progress and still moves. */
      #boot-bar i{display:block;width:62%;height:100%;border-radius:99px;position:relative;
        overflow:hidden;background:linear-gradient(90deg,#ff5bb8,#ec1188)}
      #boot-bar i::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
        animation:boot-sweep 1.4s ease-in-out infinite}
      @keyframes boot-sweep{100%{transform:translateX(100%)}}
      #boot-loading{margin-top:14px;font-size:10px;letter-spacing:.34em;color:#b9a7b1}
      #boot-tag{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:10px;
        letter-spacing:.24em;color:#c9b8c2;white-space:nowrap}
      #boot-tag b{color:#ec1188;font-weight:700;margin:0 8px}
      /* A phone in landscape, or a very short screen, must not clip the mark. */
      @media (max-height:520px){
        #boot-logo{width:84px;height:84px}#boot-name{font-size:19px;margin-top:16px}
        #boot-bar{margin-top:26px}#boot-tag{bottom:18px}
      }
      @media (prefers-reduced-motion:reduce){#boot-bar i::after{animation:none}}
    </style>
  </head>
